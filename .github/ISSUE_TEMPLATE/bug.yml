name: Reproducible defect
description: Report a problem with synthetic evidence only.
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private schedules, account IDs, medical information, or live exploit details. See SECURITY.md."
  - type: textarea
    id: environment
    attributes:
      label: Commit and environment
      description: Python, OS, component, and commit SHA.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal synthetic reproduction
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and observed outcome
      description: Distinguish a reported action, actual provider state and real-world completion.
    validations:
      required: true
